services:
  mysql:
    image: mysql:8.0
    container_name: sistform-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: sistform
      MYSQL_USER: sistform
      MYSQL_PASSWORD: sistform123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - "../Base de Datos/sistform.sql:/docker-entrypoint-initdb.d/sistform.sql"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: script/Dockerfile
    container_name: sistform-api
    restart: unless-stopped
    ports:
      - "5174:5174"
    environment:
      ConnectionStrings__DefaultConnection: "Server=mysql;Database=sistform;Uid=sistform;Pwd=sistform123;"
      Jwt__Key: "EstaEsUnaClaveSuperSecretaYLoSuficientementeLarga12345!"
      Jwt__Issuer: "http://localhost:5174"
      Jwt__Audience: "http://localhost:5174"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
