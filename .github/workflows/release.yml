name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

env:
  DOTNET_VERSION: 10.0.x

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore SistForm-API.Tests/SistForm-API.Tests.csproj
      - run: dotnet test SistForm-API.Tests/SistForm-API.Tests.csproj -c Release --no-restore
      - run: dotnet restore SistForm-API/SistForm-API.csproj
      - run: dotnet build SistForm-API/SistForm-API.csproj -c Release --no-restore

  build:
    name: Build ${{ matrix.name }}
    needs: test
    strategy:
      matrix:
        include:
          # Frontend — MAUI
          - name: Android APK
            category: frontend
            tfm: net10.0-android
            runner: ubuntu-latest
            workload: maui-android
            java: 17
            artifact: android-apk
            command: publish
          - name: iOS App
            category: frontend
            tfm: net10.0-ios
            runner: macos-26
            workload: maui
            artifact: ios-app
            command: build
            package: true
            continue-on-error: true
          - name: macCatalyst App
            category: frontend
            tfm: net10.0-maccatalyst
            runner: macos-26
            workload: maui
            artifact: maccatalyst-app
            command: build
            package: true
            continue-on-error: true
            extra_args: /p:PublishTrimmed=false
          - name: Windows App
            category: frontend
            tfm: net10.0-windows10.0.19041.0
            runner: windows-latest
            workload: maui
            artifact: windows-app
            command: publish
            publish_zip: true
          - name: Linux GTK4 x64
            category: frontend-linux
            runner: ubuntu-latest
            runtime: linux-x64
            artifact: linux-gtk4-x64
            command: publish-linux
          - name: Linux GTK4 ARM64
            category: frontend-linux
            runner: ubuntu-latest
            runtime: linux-arm64
            artifact: linux-gtk4-arm64
            command: publish-linux
          # Backend — API self-contained
          - name: Backend Linux x64
            category: SistForm-API
            runtime: linux-x64
            runner: ubuntu-latest
            artifact: SistForm-API-linux-x64
          - name: Backend Linux ARM64
            category: SistForm-API
            runtime: linux-arm64
            runner: ubuntu-latest
            artifact: SistForm-API-linux-arm64
          - name: Backend Windows x64
            category: SistForm-API
            runtime: win-x64
            runner: windows-latest
            artifact: SistForm-API-win-x64
          - name: Backend Windows ARM64
            category: SistForm-API
            runtime: win-arm64
            runner: windows-latest
            artifact: SistForm-API-win-arm64
          - name: Backend macOS x64
            category: SistForm-API
            runtime: osx-x64
            runner: macos-latest
            artifact: SistForm-API-macos-x64
          - name: Backend macOS ARM64
            category: SistForm-API
            runtime: osx-arm64
            runner: macos-latest
            artifact: SistForm-API-macos-arm64
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.continue-on-error || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Frontend: install workloads
      - if: matrix.category == 'frontend'
        name: Install MAUI workload
        run: dotnet workload install ${{ matrix.workload }}
      - if: matrix.category == 'frontend' && matrix.java
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: ${{ matrix.java }}

      # Frontend: build or publish
      - if: matrix.category == 'frontend' && matrix.command == 'build'
        name: Build MAUI app
        env:
          CI: ""
        run: dotnet build Forms/Forms.csproj -f ${{ matrix.tfm }} -c Release ${{ matrix.extra_args }}

      - if: matrix.category == 'frontend' && matrix.command == 'publish'
        name: Publish MAUI app
        env:
          CI: ""
        run: dotnet publish Forms/Forms.csproj -f ${{ matrix.tfm }} -c Release ${{ matrix.extra_args }}

      # Backend: publish self-contained
      - if: matrix.category == 'SistForm-API'
        name: Publish SistForm-API
        run: dotnet publish SistForm-API/SistForm-API.csproj -c Release --runtime ${{ matrix.runtime }} --self-contained -o publish/${{ matrix.artifact }}

      # Linux GTK4: publish self-contained
      - if: matrix.command == 'publish-linux'
        name: Install GTK4 dependencies and publish
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            gobject-introspection \
            libgirepository1.0-dev \
            pkg-config
          dotnet publish Forms.Linux/Forms.Linux.csproj -c Release --runtime ${{ matrix.runtime }} --self-contained -o publish/${{ matrix.artifact }}

      # Package iOS/macCatalyst bundle to .zip
      - if: matrix.package
        name: Package app bundle
        shell: bash
        run: |
          cd Forms/bin/Release
          app_dir=$(find . -path "*/${{ matrix.tfm }}/*.app" -type d | head -1)
          if [ -n "$app_dir" ]; then
            zip -r ${{ matrix.artifact }}.zip "$app_dir"
            echo "Packaged: $app_dir"
          else
            echo "No .app bundle found, skipping packaging"
            exit 1
          fi

      # Package Windows publish output as ZIP
      - if: matrix.publish_zip
        name: Package Windows app
        shell: pwsh
        run: |
          $publishDir = "Forms/bin/Release/${{ matrix.tfm }}/win10-x64/publish"
          if (Test-Path $publishDir) {
            Compress-Archive -Path "$publishDir/*" -DestinationPath "${{ matrix.artifact }}.zip"
            Write-Host "Packaged Windows app to ${{ matrix.artifact }}.zip"
          } else {
            Write-Host "Publish directory not found at $publishDir"
            Get-ChildItem -Path "Forms/bin/Release/${{ matrix.tfm }}" -Recurse | Select-Object FullName
            exit 1
          }

      # Upload artifacts
      - if: matrix.category == 'frontend' && matrix.command == 'publish' && !matrix.publish_zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            Forms/bin/Release/${{ matrix.tfm }}/*.apk
            Forms/bin/Release/${{ matrix.tfm }}/*.aab
      - if: matrix.category == 'frontend' && matrix.command == 'build' && !matrix.package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: Forms/bin/Release/**/${{ matrix.tfm }}/*.${{ matrix.ext }}
      - if: matrix.category == 'frontend' && (matrix.package || matrix.publish_zip)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
      - if: matrix.command == 'publish-linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: publish/${{ matrix.artifact }}/**
      - if: matrix.category == 'SistForm-API'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: publish/${{ matrix.artifact }}/**

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - name: Display structure of downloaded files
        run: ls -laR

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            android-apk/*
            ios-app/*.zip
            maccatalyst-app/*.zip
            windows-app/*.zip
            linux-gtk4-x64/**
            linux-gtk4-arm64/**
            SistForm-API-linux-x64/**
            SistForm-API-linux-arm64/**
            SistForm-API-win-x64/**
            SistForm-API-win-arm64/**
            SistForm-API-macos-x64/**
            SistForm-API-macos-arm64/**
