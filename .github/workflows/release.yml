name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: 10.0.x

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore AuthLogin.Tests/AuthLogin.Tests.csproj
      - run: dotnet test AuthLogin.Tests/AuthLogin.Tests.csproj -c Release --no-restore

  build:
    name: Build ${{ matrix.name }}
    needs: test
    strategy:
      matrix:
        include:
          # Frontend — MAUI
          - name: Android APK
            category: frontend
            tfm: net10.0-android
            runner: ubuntu-latest
            workload: maui-android
            java: 17
            artifact: android-apk
            ext: apk
          - name: iOS App
            category: frontend
            tfm: net10.0-ios
            runner: macos-26
            workload: maui
            xcode: /Applications/Xcode_26.5.app
            artifact: ios-app
            package: true
            continue-on-error: true
          - name: macCatalyst App
            category: frontend
            tfm: net10.0-maccatalyst
            runner: macos-26
            workload: maui
            xcode: /Applications/Xcode_26.5.app
            artifact: maccatalyst-app
            package: true
            continue-on-error: true
          - name: Windows App
            category: frontend
            tfm: net10.0-windows10.0.19041.0
            runner: windows-latest
            workload: maui
            artifact: windows-app
            ext: exe
          # Backend — API self-contained
          - name: Backend Linux
            category: backend
            runtime: linux-x64
            runner: ubuntu-latest
            artifact: backend-linux
          - name: Backend Windows
            category: backend
            runtime: win-x64
            runner: windows-latest
            artifact: backend-win
          - name: Backend macOS
            category: backend
            runtime: osx-x64
            runner: macos-26
            artifact: backend-macos
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.continue-on-error || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Frontend: install workloads
      - if: matrix.category == 'frontend'
        name: Install MAUI workload
        run: dotnet workload install ${{ matrix.workload }}
      - if: matrix.category == 'frontend' && matrix.java
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: ${{ matrix.java }}
      - if: matrix.category == 'frontend' && matrix.xcode
        name: Select Xcode
        run: sudo xcode-select -s ${{ matrix.xcode }}
      - if: matrix.category == 'frontend'
        name: Build MAUI app
        env:
          CI: ""
        run: dotnet build Forms/Forms.csproj -f ${{ matrix.tfm }} -c Release

      # Backend: publish self-contained
      - if: matrix.category == 'backend'
        name: Publish backend API
        run: dotnet publish AuthLogin/AuthLogin.csproj -c Release --runtime ${{ matrix.runtime }} --self-contained -o publish/${{ matrix.artifact }}

      # Package iOS/macCatalyst bundle to .zip
      - if: matrix.package
        name: Package app bundle
        run: |
          cd Forms/bin/Release
          app_dir=$(find . -path "*/${{ matrix.tfm }}/*.app" -type d | head -1)
          zip -r ${{ matrix.artifact }}.zip "$app_dir"

      # Upload artifact
      - if: matrix.category == 'frontend' && !matrix.package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: Forms/bin/Release/**/${{ matrix.tfm }}/*.${{ matrix.ext }}
      - if: matrix.category == 'frontend' && matrix.package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: Forms/bin/Release/${{ matrix.artifact }}.zip
      - if: matrix.category == 'backend'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: publish/${{ matrix.artifact }}/**

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            android-apk/**/*.apk
            ios-app/**/*.zip
            maccatalyst-app/**/*.zip
            windows-app/**/*.exe
            backend-linux/**
            backend-win/**
            backend-macos/**
