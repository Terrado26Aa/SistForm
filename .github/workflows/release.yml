name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: 10.0.x

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore test project
        run: dotnet restore AuthLogin.Tests/AuthLogin.Tests.csproj
      - name: Run tests
        run: dotnet test AuthLogin.Tests/AuthLogin.Tests.csproj -c Release --no-restore

  build-android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install MAUI workloads
        run: dotnet workload install maui-android
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17
      - name: Build Android APK
        env:
          CI: ""
        run: dotnet build Forms/Forms.csproj -f net10.0-android -c Release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Forms/bin/Release/**/net10.0-android/**/*.apk

  build-ios:
    name: Build iOS App
    needs: test
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install MAUI workloads
        run: dotnet workload install maui
      - name: Build iOS App
        env:
          CI: ""
        run: dotnet build Forms/Forms.csproj -f net10.0-ios -c Release
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: Forms/bin/Release/**/net10.0-ios/**/*.app

  build-maccatalyst:
    name: Build macCatalyst App
    needs: test
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install MAUI workloads
        run: dotnet workload install maui
      - name: Build macCatalyst App
        env:
          CI: ""
        run: dotnet build Forms/Forms.csproj -f net10.0-maccatalyst -c Release
      - name: Upload macCatalyst artifact
        uses: actions/upload-artifact@v4
        with:
          name: maccatalyst-app
          path: Forms/bin/Release/**/net10.0-maccatalyst/**/*.app

  build-windows:
    name: Build Windows App
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install MAUI workloads
        run: dotnet workload install maui
      - name: Build Windows App
        env:
          CI: ""
        run: dotnet build Forms/Forms.csproj -f net10.0-windows10.0.19041.0 -c Release
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: Forms/bin/Release/**/net10.0-windows10.0.19041.0/**/*.exe

  release:
    name: Create Release
    needs:
      - build-android
      - build-ios
      - build-maccatalyst
      - build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: List artifacts
        run: find . -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            android-apk/**/*
            ios-app/**/*
            maccatalyst-app/**/*
            windows-app/**/*
