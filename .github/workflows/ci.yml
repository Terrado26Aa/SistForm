name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x

jobs:
  SistForm-API:
    name: SistForm-API - Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore SistForm-API/SistForm-API.csproj

      - name: Build
        run: dotnet build SistForm-API/SistForm-API.csproj --no-restore -c Release

      - name: Restore tests
        run: dotnet restore SistForm-API.Tests/SistForm-API.Tests.csproj

      - name: Run tests
        run: dotnet test SistForm-API.Tests/SistForm-API.Tests.csproj -c Release --no-restore

      - name: Publish (self-contained linux-x64)
        run: dotnet publish SistForm-API/SistForm-API.csproj -c Release --runtime linux-x64 --self-contained -o publish/SistForm-API

  frontend-linux-gtk4:
    name: Frontend - Linux GTK4 Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install GTK4 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            gobject-introspection \
            libgirepository1.0-dev \
            pkg-config

      - name: Build Linux GTK4
        run: dotnet build Forms.Linux/Forms.Linux.csproj -c Release

  frontend-android:
    name: Frontend - Android Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17

      - name: Build Android
        env:
          CI: ""
        run: dotnet build Forms/Forms.csproj -f net10.0-android -c Release

  frontend-ios:
    name: Frontend - iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Build iOS
        env:
          CI: ""
        run: dotnet build Forms/Forms.csproj -f net10.0-ios -c Release

  frontend-maccatalyst:
    name: Frontend - macCatalyst Build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Build macCatalyst
        env:
          CI: ""
        run: dotnet build Forms/Forms.csproj -f net10.0-maccatalyst -c Release /p:PublishTrimmed=false

  frontend-windows:
    name: Frontend - Windows Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Build Windows
        env:
          CI: ""
        run: dotnet build Forms/Forms.csproj -f net10.0-windows10.0.19041.0 -c Release
